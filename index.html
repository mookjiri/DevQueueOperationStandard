<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task & Executive System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Header & Actions -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-xl shadow-sm">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Work & Sprint Management</h1>
        <p class="text-sm text-slate-500">Executive Dashboard, Task Board & All Tasks Table</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="downloadTemplate()" class="px-3 py-2 text-sm rounded-lg border border-slate-300 hover:bg-slate-50">
          ดาวน์โหลด Excel Template
        </button>
        <label class="px-3 py-2 text-sm rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 cursor-pointer">
          นำเข้า Excel
          <input type="file" id="excelInput" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleExcelImport(event)" />
        </label>
        <button onclick="openCreateModal()" class="px-3 py-2 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-700">
          + สร้างงานใหม่
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex gap-2 border-b border-slate-200 pb-2">
      <button id="tab-dashboard" onclick="switchTab('dashboard')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white">
        Executive Dashboard
      </button>
      <button id="tab-board" onclick="switchTab('board')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-700 hover:bg-slate-50">
        Task Board
      </button>
      <button id="tab-table" onclick="switchTab('table')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-700 hover:bg-slate-50">
        ตารางข้อมูลงานทั้งหมด
      </button>
    </div>

    <!-- Multi-Select Checkbox Filters -->
    <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold text-slate-700">ตัวกรองข้อมูล (เลือกได้มากกว่า 1 รายการต่อหมวด)</span>
        <button onclick="clearFilters()" class="text-xs text-rose-600 hover:underline font-medium">
          ล้างตัวกรองทั้งหมด
        </button>
      </div>
      <div id="filterPanel" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3"></div>
    </div>

    <!-- Import / Validation Feedback -->
    <div id="alertBox" class="hidden p-4 rounded-xl text-sm"></div>

    <!-- View 1: Executive Dashboard -->
    <section id="view-dashboard" class="space-y-4">
      <div id="kpiCards" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm">
          <h3 class="font-semibold mb-3">สรุปตามสถานะงาน (Status)</h3>
          <div id="chartByStatus" class="space-y-2 text-sm"></div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm">
          <h3 class="font-semibold mb-3">สรุปตามแผนก / บริษัทลูก</h3>
          <div id="chartByDept" class="space-y-2 text-sm"></div>
        </div>
      </div>
    </section>

    <!-- View 2: Task Board -->
    <section id="view-board" class="hidden">
      <div id="boardColumns" class="grid grid-cols-1 md:grid-cols-4 gap-4"></div>
    </section>

    <!-- View 3: All Tasks Table -->
    <section id="view-table" class="hidden bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-50 border-b text-slate-600">
            <tr>
              <th class="p-3">รหัส</th>
              <th class="p-3">ชื่องาน</th>
              <th class="p-3">สถานะ</th>
              <th class="p-3">Sprint</th>
              <th class="p-3">แหล่งที่มา</th>
              <th class="p-3">แผนก / บริษัทลูก</th>
              <th class="p-3">สมาชิกในทีม</th>
            </tr>
          </thead>
          <tbody id="taskTableBody" class="divide-y"></tbody>
        </table>
      </div>
      <div class="flex items-center justify-between p-3 bg-slate-50 border-t text-xs text-slate-600">
        <span id="tableInfo"></span>
        <div class="flex gap-2">
          <button onclick="changePage(-1)" class="px-2.5 py-1 rounded border bg-white disabled:opacity-40" id="prevPageBtn">ก่อนหน้า</button>
          <button onclick="changePage(1)" class="px-2.5 py-1 rounded border bg-white disabled:opacity-40" id="nextPageBtn">ถัดไป</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Create Task Modal -->
  <div id="createModal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-lg w-full p-5 space-y-4 shadow-lg">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg">สร้างงานใหม่</h3>
        <button onclick="closeCreateModal()" class="text-slate-400 hover:text-slate-700">✕</button>
      </div>
      <form id="createTaskForm" onsubmit="handleCreateTask(event)" class="space-y-3 text-sm">
        <div>
          <label class="block font-medium mb-1">ชื่องาน *</label>
          <input name="title" required class="w-full border rounded-lg px-3 py-2" placeholder="เช่น ปรับหน้า Dashboard" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium mb-1">สถานะงาน</label>
            <select name="status" class="w-full border rounded-lg px-3 py-2">
              <option>To Do</option>
              <option>In Progress</option>
              <option>Review</option>
              <option>Done</option>
            </select>
          </div>
          <div>
            <label class="block font-medium mb-1">Sprint / รอบส่งมอบ *</label>
            <input name="sprint" required class="w-full border rounded-lg px-3 py-2" placeholder="เช่น Sprint 1" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-medium mb-1">แหล่งที่มา (Source) *</label>
            <input name="source" required class="w-full border rounded-lg px-3 py-2" placeholder="เช่น ลูกค้า / ภายใน / Audit" />
          </div>
          <div>
            <label class="block font-medium mb-1">แผนก / บริษัทลูก *</label>
            <input name="department" required class="w-full border rounded-lg px-3 py-2" placeholder="เช่น IT / บจก. A" />
          </div>
        </div>
        <div>
          <label class="block font-medium mb-1">สมาชิกในทีม (คั่นด้วยจุลภาค , ได้หลายคน)</label>
          <input name="assignees" class="w-full border rounded-lg px-3 py-2" placeholder="เช่น สมชาย, สมหญิง" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeCreateModal()" class="px-4 py-2 rounded-lg border">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">บันทึกงาน</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STATUS_LIST = ['To Do', 'In Progress', 'Review', 'Done'];
    const PAGE_SIZE = 5;

    let state = {
      activeTab: 'dashboard',
      currentPage: 1,
      filters: {
        status: [],
        sprint: [],
        source: [],
        department: [],
        assignees: []
      },
      tasks: [
        { id: 'TSK-101', title: 'ออกแบบระบบ Filter หลายเงื่อนไข', status: 'In Progress', sprint: 'Sprint 1', source: 'Product', department: 'IT', assignees: ['สมชาย', 'สมหญิง'] },
        { id: 'TSK-102', title: 'ตรวจสอบงบไตรมาส 4', status: 'Review', sprint: 'Sprint 1', source: 'Audit', department: 'บจก. A', assignees: ['วิชัย'] },
        { id: 'TSK-103', title: 'เชื่อมต่อ API รายงานผู้บริหาร', status: 'To Do', sprint: 'Sprint 2', source: 'Executive', department: 'IT', assignees: ['สมชาย'] },
        { id: 'TSK-104', title: 'อัปเดตคู่มือพนักงานใหม่', status: 'Done', sprint: 'Sprint 1', source: 'HR', department: 'บจก. B', assignees: [] }
      ]
    };

    const norm = (v) => String(v ?? '').trim();

    function getFilterOptions() {
      const unique = (extractor) => {
        const set = new Set();
        state.tasks.forEach((t) => {
          const vals = extractor(t);
          vals.forEach((v) => { if (norm(v)) set.add(norm(v)); });
        });
        return Array.from(set);
      };
      return {
        status: STATUS_LIST,
        sprint: unique((t) => [t.sprint]),
        source: unique((t) => [t.source]),
        department: unique((t) => [t.department]),
        assignees: unique((t) => Array.isArray(t.assignees) && t.assignees.length ? t.assignees : ['Unassigned'])
      };
    }

    function renderFilterPanel() {
      const options = getFilterOptions();
      const labels = {
        status: 'สถานะงาน',
        sprint: 'Sprint / รอบส่งมอบ',
        source: 'แหล่งที่มา',
        department: 'แผนก / บริษัทลูก',
        assignees: 'สมาชิกในทีม'
      };

      const container = document.getElementById('filterPanel');
      container.innerHTML = Object.keys(labels).map((key) => {
        const items = options[key] || [];
        return `
          <div class="border rounded-lg p-2.5 bg-slate-50/70">
            <div class="text-xs font-semibold text-slate-700 mb-1.5">${labels[key]}</div>
            <div class="max-h-28 overflow-y-auto space-y-1 pr-1">
              ${items.length ? items.map((opt) => {
                const checked = state.filters[key].includes(opt) ? 'checked' : '';
                return `
                  <label class="flex items-center gap-2 text-xs cursor-pointer hover:bg-white px-1 py-0.5 rounded">
                    <input type="checkbox" ${checked} onchange="toggleFilter('${key}', '${opt.replace(/'/g, "\\'")}')" class="rounded text-blue-600" />
                    <span class="truncate">${opt}</span>
                  </label>
                `;
              }).join('') : '<div class="text-xs text-slate-400">ไม่มีตัวเลือก</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleFilter(key, value) {
      const arr = state.filters[key];
      const idx = arr.indexOf(value);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push(value);
      // Bug fix: รีเซ็ตหน้าตารางกลับไปหน้า 1 ทุกครั้งที่เปลี่ยนตัวกรอง
      state.currentPage = 1;
      renderAll();
    }

    function clearFilters() {
      state.filters = { status: [], sprint: [], source: [], department: [], assignees: [] };
      state.currentPage = 1;
      renderAll();
    }

    function getFilteredTasks() {
      return state.tasks.filter((task) => {
        const { status, sprint, source, department, assignees } = state.filters;
        // OR ภายในหมวดเดียวกัน, AND ข้ามหมวด
        if (status.length && !status.includes(norm(task.status))) return false;
        if (sprint.length && !sprint.includes(norm(task.sprint))) return false;
        if (source.length && !source.includes(norm(task.source))) return false;
        if (department.length && !department.includes(norm(task.department))) return false;

        if (assignees.length) {
          const taskMembers = Array.isArray(task.assignees) && task.assignees.length
            ? task.assignees.map(norm)
            : ['Unassigned'];
          const matched = assignees.some((sel) => taskMembers.includes(sel));
          if (!matched) return false;
        }
        return true;
      });
    }

    function switchTab(tab) {
      state.activeTab = tab;
      ['dashboard', 'board', 'table'].forEach((t) => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        btn.className = t === tab
          ? 'tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white'
          : 'tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-white text-slate-700 hover:bg-slate-50';
      });
      renderAll();
    }

    function renderDashboard(tasks) {
      const total = tasks.length;
      const done = tasks.filter((t) => t.status === 'Done').length;
      const inProg = tasks.filter((t) => t.status === 'In Progress').length;
      const rate = total ? Math.round((done / total) * 100) : 0;

      document.getElementById('kpiCards').innerHTML = `
        <div class="bg-white p-4 rounded-xl shadow-sm"><div class="text-xs text-slate-500">งานทั้งหมดตามฟิลเตอร์</div><div class="text-2xl font-bold mt-1">${total}</div></div>
        <div class="bg-white p-4 rounded-xl shadow-sm"><div class="text-xs text-slate-500">กำลังทำ (In Progress)</div><div class="text-2xl font-bold text-blue-600 mt-1">${inProg}</div></div>
        <div class="bg-white p-4 rounded-xl shadow-sm"><div class="text-xs text-slate-500">เสร็จสิ้น (Done)</div><div class="text-2xl font-bold text-emerald-600 mt-1">${done}</div></div>
        <div class="bg-white p-4 rounded-xl shadow-sm"><div class="text-xs text-slate-500">อัตราความสำเร็จ</div><div class="text-2xl font-bold mt-1">${rate}%</div></div>
      `;

      const renderBars = (targetId, groupFn) => {
        const counts = {};
        tasks.forEach((t) => {
          const k = norm(groupFn(t)) || 'ไม่ระบุ';
          counts[k] = (counts[k] || 0) + 1;
        });
        const entries = Object.entries(counts);
        document.getElementById(targetId).innerHTML = entries.length ? entries.map(([k, v]) => {
          const pct = total ? Math.round((v / total) * 100) : 0;
          return `
            <div>
              <div class="flex justify-between mb-1"><span>${k}</span><span>${v} (${pct}%)</span></div>
              <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div class="bg-blue-600 h-full" style="width:${pct}%"></div>
              </div>
            </div>
          `;
        }).join('') : '<div class="text-slate-400">ไม่มีข้อมูลตามเงื่อนไขที่เลือก</div>';
      };

      renderBars('chartByStatus', (t) => t.status);
      renderBars('chartByDept', (t) => t.department);
    }

    function renderBoard(tasks) {
      const container = document.getElementById('boardColumns');
      container.innerHTML = STATUS_LIST.map((colStatus) => {
        const colTasks = tasks.filter((t) => t.status === colStatus);
        return `
          <div class="bg-white rounded-xl p-3 shadow-sm min-h-[260px]"
               ondragover="event.preventDefault()"
               ondrop="handleDropTask(event, '${colStatus}')">
            <div class="flex items-center justify-between mb-3 pb-2 border-b">
              <span class="font-semibold text-sm">${colStatus}</span>
              <span class="text-xs bg-slate-100 px-2 py-0.5 rounded-full">${colTasks.length}</span>
            </div>
            <div class="space-y-2.5">
              ${colTasks.length ? colTasks.map((t) => `
                <div draggable="true" ondragstart="handleDragStart(event, '${t.id}')"
                     class="border rounded-lg p-3 bg-slate-50 hover:bg-white cursor-grab active:cursor-grabbing space-y-1.5">
                  <div class="text-[11px] text-slate-400">${t.id} • ${t.sprint}</div>
                  <div class="font-medium text-sm">${t.title}</div>
                  <div class="flex flex-wrap gap-1 text-[11px]">
                    <span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700">${t.department}</span>
                    <span class="px-2 py-0.5 rounded bg-slate-200 text-slate-700">${t.source}</span>
                  </div>
                  <div class="text-xs text-slate-500 pt-1">
                    ผู้รับผิดชอบ: ${(t.assignees && t.assignees.length) ? t.assignees.join(', ') : 'Unassigned'}
                  </div>
                </div>
              `).join('') : '<div class="text-xs text-slate-400 text-center py-6">ไม่มีงานในคอลัมน์นี้</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function handleDragStart(e, taskId) {
      e.dataTransfer.setData('text/plain', taskId);
    }

    function handleDropTask(e, newStatus) {
      e.preventDefault();
      const taskId = e.dataTransfer.getData('text/plain');
      const task = state.tasks.find((t) => t.id === taskId);
      if (task && task.status !== newStatus) {
        task.status = newStatus;
        renderAll();
      }
    }

    function renderTable(tasks) {
      const totalPages = Math.max(1, Math.ceil(tasks.length / PAGE_SIZE));
      if (state.currentPage > totalPages) state.currentPage = totalPages;

      const start = (state.currentPage - 1) * PAGE_SIZE;
      const pageItems = tasks.slice(start, start + PAGE_SIZE);

      document.getElementById('taskTableBody').innerHTML = pageItems.length ? pageItems.map((t) => `
        <tr class="hover:bg-slate-50">
          <td class="p-3 font-mono text-xs">${t.id}</td>
          <td class="p-3 font-medium">${t.title}</td>
          <td class="p-3"><span class="px-2 py-0.5 rounded bg-slate-100 text-xs">${t.status}</span></td>
          <td class="p-3">${t.sprint}</td>
          <td class="p-3">${t.source}</td>
          <td class="p-3">${t.department}</td>
          <td class="p-3">${(t.assignees && t.assignees.length) ? t.assignees.join(', ') : 'Unassigned'}</td>
        </tr>
      `).join('') : `<tr><td colspan="7" class="p-6 text-center text-slate-400">ไม่พบข้อมูลที่ตรงกับฟิลเตอร์</td></tr>`;

      document.getElementById('tableInfo').textContent = `แสดง ${pageItems.length} จาก ${tasks.length} รายการ (หน้า ${state.currentPage}/${totalPages})`;
      document.getElementById('prevPageBtn').disabled = state.currentPage <= 1;
      document.getElementById('nextPageBtn').disabled = state.currentPage >= totalPages;
    }

    function changePage(delta) {
      state.currentPage += delta;
      renderTable(getFilteredTasks());
    }

    function openCreateModal() {
      document.getElementById('createModal').classList.remove('hidden');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
      document.getElementById('createTaskForm').reset();
    }

    function generateTaskId() {
      const nums = state.tasks.map((t) => parseInt(String(t.id).replace(/\D/g, ''), 10) || 100);
      return `TSK-${Math.max(...nums, 100) + 1}`;
    }

    function handleCreateTask(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const assignees = norm(fd.get('assignees'))
        ? norm(fd.get('assignees')).split(',').map(norm).filter(Boolean)
        : [];

      state.tasks.unshift({
        id: generateTaskId(),
        title: norm(fd.get('title')),
        status: STATUS_LIST.includes(norm(fd.get('status'))) ? norm(fd.get('status')) : 'To Do',
        sprint: norm(fd.get('sprint')),
        source: norm(fd.get('source')),
        department: norm(fd.get('department')),
        assignees
      });

      closeCreateModal();
      showAlert('success', 'สร้างงานใหม่เรียบร้อยแล้ว');
      renderAll();
    }

    function downloadTemplate() {
      const sampleRows = [
        {
          title: 'ตัวอย่าง: ปรับปรุงหน้ารายงาน',
          status: 'To Do',
          sprint: 'Sprint 2',
          source: 'Internal',
          department: 'IT',
          assignees: 'สมชาย, สมหญิง'
        }
      ];
      const ws = XLSX.utils.json_to_sheet(sampleRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'TasksTemplate');
      XLSX.writeFile(wb, 'task_import_template.xlsx');
    }

    function handleExcelImport(e) {
      const file = e.target.files?.[0];
      e.target.value = ''; // Bug fix: เคลียร์ค่า input เพื่อให้เลือกไฟล์เดิมซ้ำได้
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const firstSheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });

          if (!rows.length) {
            showAlert('error', 'ไฟล์ Excel ไม่มีข้อมูลแถวงาน');
            return;
          }

          const errors = [];
          const validTasks = [];

          rows.forEach((row, idx) => {
            const rowNum = idx + 2; // +2 เพราะแถว 1 คือ Header
            const title = norm(row.title);
            const rawStatus = norm(row.status) || 'To Do';
            const sprint = norm(row.sprint);
            const source = norm(row.source);
            const department = norm(row.department);
            const assignees = norm(row.assignees)
              ? norm(row.assignees).split(',').map(norm).filter(Boolean)
              : [];

            const rowErrors = [];
            if (!title) rowErrors.push('missing title');
            if (!STATUS_LIST.includes(rawStatus)) rowErrors.push(`invalid status "${rawStatus}"`);
            if (!sprint) rowErrors.push('missing sprint');
            if (!source) rowErrors.push('missing source');
            if (!department) rowErrors.push('missing department');

            if (rowErrors.length) {
              errors.push(`แถวที่ ${rowNum}: ${rowErrors.join(', ')}`);
            } else {
              validTasks.push({
                id: generateTaskId() + (validTasks.length ? `-${validTasks.length + 1}` : ''),
                title,
                status: rawStatus,
                sprint,
                source,
                department,
                assignees
              });
            }
          });

          // ปรับ ID ให้เรียงต่อเนื่อง
          const baseNum = Math.max(100, ...state.tasks.map((t) => parseInt(String(t.id).replace(/\D/g, ''), 10) || 100));
          validTasks.forEach((t, i) => { t.id = `TSK-${baseNum + i + 1}`; });

          if (validTasks.length) {
            state.tasks = [...validTasks, ...state.tasks];
            renderAll();
          }

          if (errors.length && validTasks.length) {
            showAlert('warn', `นำเข้าสำเร็จ ${validTasks.length} แถว แต่ข้าม ${errors.length} แถวที่มีข้อผิดพลาด:<br>${errors.join('<br>')}`);
          } else if (errors.length) {
            showAlert('error', `นำเข้าไม่สำเร็จ พบข้อผิดพลาด:<br>${errors.join('<br>')}`);
          } else {
            showAlert('success', `นำเข้าข้อมูลจาก Excel สำเร็จทั้งหมด ${validTasks.length} รายการ`);
          }
        } catch (err) {
          showAlert('error', `ไม่สามารถอ่านไฟล์ได้: ${err.message}`);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function showAlert(type, htmlMsg) {
      const box = document.getElementById('alertBox');
      const styles = {
        success: 'bg-emerald-50 text-emerald-800 border border-emerald-200',
        warn: 'bg-amber-50 text-amber-800 border border-amber-200',
        error: 'bg-rose-50 text-rose-800 border border-rose-200'
      };
      box.className = `p-4 rounded-xl text-sm ${styles[type] || styles.success}`;
      box.innerHTML = htmlMsg;
      box.classList.remove('hidden');
    }

    function renderAll() {
      renderFilterPanel();
      const filtered = getFilteredTasks();
      renderDashboard(filtered);
      renderBoard(filtered);
      renderTable(filtered);
    }

    renderAll();
  </script>
</body>
</html>
